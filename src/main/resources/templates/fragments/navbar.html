<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<style>
    :root {
        --primary: #2c3e50;    /* Màu xanh đậm chủ đạo */
        --secondary: #34495e;  /* Màu phụ */
        --accent: #3498db;     /* Màu xanh sáng (nút bấm) */
        --success: #27ae60;    /* Màu xanh lá (thành công) */
        --danger: #e74c3c;     /* Màu đỏ (lỗi/xóa) */
        --warning: #f39c12;    /* Màu cam (cảnh báo) */
        --light: #ecf0f1;      /* Màu nền sáng */
        --dark: #2c3e50;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        color: #333;
    }

    /* --- NAVBAR --- */
    .navbar {
        background-color: var(--primary);
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        color: white;
    }
    .navbar a { color: white; text-decoration: none; margin-left: 15px; font-weight: 500; transition: 0.3s; }
    .navbar a:hover { color: var(--accent); }
    .nav-brand { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; }
    .nav-user { font-size: 0.9rem; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; }

    /* --- TABLES (Bảng đẹp) --- */
    table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    th { background-color: var(--secondary); color: white; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
    tr:hover { background-color: #f1f1f1; }

    /* --- BUTTONS (Nút bấm chuẩn) --- */
    .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; font-size: 14px; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary { background-color: var(--accent); color: white; }
    .btn-success { background-color: var(--success); color: white; }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-warning { background-color: var(--warning); color: white; }
    .btn-outline { border: 1px solid var(--primary); color: var(--primary); background: transparent; }
    
    /* --- FORM & INPUTS --- */
    input[type="text"], input[type="password"], input[type="email"], input[type="number"] {
        padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px;
    }
    input:focus { border-color: var(--accent); outline: none; }

    /* --- TIỆN ÍCH KHÁC --- */
    .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
    .page-title { color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; display: inline-block; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
    .badge-success { background-color: var(--success); }
    .badge-danger { background-color: var(--danger); }
    .badge-warning { background-color: var(--warning); }
</style>

<div class="navbar">
    <div class="nav-brand">
        <a href="/" style="margin-left:0; font-size: 1.4rem;">📚 Library Manager</a>
        
        <span th:if="${session.currentUser != null && session.currentUser.role == 'READER'}">
            <a href="/library/books">📘 Sách</a>
            <a href="/reader/current-loans">📖 Đang mượn</a>
            <a href="/reader/history">📜 Lịch sử</a>
        </span>

        <span th:if="${session.currentUser != null && session.currentUser.role == 'ADMIN'}">
            <a href="/admin/approve-requests">✅ Duyệt mượn</a>
            <a href="/admin/return-book">↩️ Trả sách</a>
            <a href="/library/books">📚 Kho sách</a>
            <a href="/admin/users">👥 Độc giả</a>
        </span>
    </div>

    <div class="nav-user">
        <span th:if="${session.currentUser != null}">
            👤 <span th:text="${session.currentUser.fullName}">User</span>
            <a href="/auth/logout" style="color: #ff7675; margin-left: 10px; font-size: 0.9em;">(Đăng xuất)</a>
        </span>
        <span th:if="${session.currentUser == null}">
            <a href="/auth/login">🔑 Đăng nhập</a>
        </span>
    </div>
</div>

</body>
</html>
