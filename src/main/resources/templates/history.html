<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lịch sử mượn trả</title>
</head>
<body>
<div th:replace="fragments/navbar :: body"></div>

<div class="container">
    <h2 class="page-title">📜 Lịch Sử Mượn Trả</h2>

    <div th:if="${#lists.isEmpty(history)}" style="text-align:center; margin-top:30px;">
        <p>Chưa có dữ liệu lịch sử.</p>
    </div>

    <table th:if="${!#lists.isEmpty(history)}">
        <thead>
            <tr>
                <th>Sách</th>
                <th>Ngày mượn</th>
                <th>Hạn trả</th>
                <th>Ngày trả</th>
                <th>Trạng thái</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="l : ${history}">
                <td th:text="${l.book.title}"></td>
                <td th:text="${l.issueDate}"></td>
                <td th:text="${l.dueDate}"></td>
                <td th:text="${l.returnDate != null ? l.returnDate : '-'}"></td>
                <td>
                    <span th:if="${l.status == 'OPEN'}" class="badge badge-success">Đang mượn</span>
                    <span th:if="${l.status == 'CLOSED'}" class="badge" style="background:#7f8c8d;">Đã trả</span>
                    <span th:if="${l.status == 'RETURNING'}" class="badge badge-warning">Đang trả...</span>
                </td>
            </tr>
        </tbody>
    </table>

    <div style="margin-top:20px;">
        <a th:if="${session.currentUser.role == 'READER'}" href="/" class="btn btn-outline">⬅ Quay lại Trang chủ</a>
        <a th:if="${session.currentUser.role == 'ADMIN'}" href="/admin/users" class="btn btn-outline">⬅ Quay lại Danh sách User</a>
    </div>
</div>
</body>
</html>
