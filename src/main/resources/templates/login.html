<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #2c3e50, #3498db); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 350px; text-align: center; }
        .login-card h2 { color: #2c3e50; margin-bottom: 20px; }
        .form-control { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #2980b9; }
        .error-msg { color: #e74c3c; background: #fadbd8; padding: 10px; border-radius: 5px; font-size: 14px; margin-bottom: 15px; }
        .success-msg { color: #27ae60; background: #d5f5e3; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        a { color: #3498db; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>📚 Thư viện Online</h2>
        
        <div th:if="${param.error}" class="error-msg">❌ Sai tài khoản hoặc mật khẩu!</div>
        <div th:if="${param.success}" class="success-msg">✅ Đăng ký thành công!</div>

        <form action="/auth/login" method="post">
            <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required>
            <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required>
            <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
        </form>

        <br>
        <a href="/auth/register">Chưa có tài khoản? <b>Đăng ký ngay</b></a>
    </div>
</body>
</html>
